<style>
/* Built only from the Procurement Redesign design system (Figma 183:2 / Components 184:2)
   and the littleboxindia.com palette. Same top bar, stat cards, Requests card, chips, table,
   badges and request-details drawer as the Procurement Queue screens. */
:root {
  --text-1: #111111; --text-2: #5e5e62; --icon: #313132;
  --surface: #ffffff; --sunken: #f9f9f9; --neutral: #f1f1f1;
  --b-default: #dadada; --b-subtle: #e6e6e6; --b-sep: #ededed; --b-input: #8e8e8e;
  --action: #111111;
  --ok-bg: #e6f4ec; --ok-b: #bfe3cd; --ok-t: #23824f; --ok-bold: #3aa76d;
  --info-bg: #e8f1fd; --info-b: #bcd5f7; --info-t: #2563c9;
  --warn-bg: #fff4e0; --warn-b: #f6d08f; --warn-t: #b06d00;
  --crit-bg: #fdecea; --crit-b: #f7c4bf; --crit-t: #d0392b; --crit: #e5534b;
  --c-teal: #4f9d8a; --c-teal-s: #dcefe9; --c-purple: #8b8cf0; --c-purple-s: #ececfd; --c-yellow: #e5cf4f; --c-yellow-s: #faf6d6;
  --c-blue: #4a9ae8; --c-blue-s: #e3effc; --c-grey: #c4c4c4; --c-grey-s: #f1f1f1; --c-amber: #f0a92e; --c-amber-s: #fdf0d8; --c-red: #e5534b; --c-red-s: #fbe1de;
  --display: Poppins, system-ui, sans-serif; --text: Jost, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 400 15px/24px var(--text); color: var(--text-1); background: var(--surface); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input, select { font-family: var(--text); color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
i.ti { line-height: 1; }

/* Type roles */
.eyebrow { font: 500 12px/16px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.title-sm { font: 600 15px/24px var(--display); }
.title-md { font: 600 18px/24px var(--display); }
.headline-sm { font: 600 26px/36px var(--display); }
.headline-md { font: 600 31px/40px var(--display); }
.body-sm { font: 400 13px/20px var(--text); }
.label-md { font: 500 13px/20px var(--text); }
.muted { color: var(--text-2); }

/* Top nav */
.topnav { position: sticky; top: 0; z-index: 50; height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--b-sep); }
.logo { font: 600 18px/24px var(--display); min-width: 196px; background: none; text-align: left; }
.nav-search { position: relative; width: 440px; }
.nav-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--icon); }
.nav-search input { width: 100%; height: 40px; border-radius: 9999px; border: 1px solid var(--b-default); background: var(--sunken); padding: 0 16px 0 38px; font: 400 16px/24px var(--text); outline: none; }
.nav-search input::placeholder { color: var(--text-2); }
.nav-right { margin-left: auto; display: flex; gap: 12px; }
.round-btn { position: relative; width: 40px; height: 40px; border-radius: 9999px; border: 1px solid var(--b-default); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--icon); }
.round-btn.open { border-color: var(--action); }
.bell-count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9999px; background: var(--action); color: #fff; border: 2px solid var(--surface); font: 500 10px/14px var(--display); }

/* Page */
.page { max-width: 1440px; margin: 0 auto; padding: 32px 32px 64px; }
.view { display: none; } .view.active { display: block; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
.page-header p { margin-top: 2px; }
.crumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--text-2); }
.crumb button { font: inherit; color: var(--text-2); text-decoration: underline; }

/* Stat cards (as Procurement Queue: eyebrow + number, no icons) */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat { text-align: left; background: var(--surface); border: 1px solid var(--b-default); border-radius: 4px; padding: 24px; }
button.stat:hover { border-color: var(--b-input); }
.stat.sel { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); }
.stat .headline-md { margin-top: 4px; }
.stat .body-sm { margin-top: 2px; }

/* KPI strip (one card, four columns) */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--b-default); border-radius: 4px; margin-bottom: 24px; }
.kpi-cell { text-align: left; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; background: var(--surface); }
.kpi-cell + .kpi-cell { border-left: 1px solid var(--b-default); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.kpi-top .headline-sm { margin-top: 2px; }
.spark { width: 120px; height: 36px; flex-shrink: 0; }
.delta { font-weight: 500; } .delta.up { color: var(--ok-t); } .delta.down { color: var(--warn-t); }
button.kpi-cell { border-radius: 0 4px 4px 0; }
button.kpi-cell:hover { background: var(--sunken); }
.kpi-cell.sel { box-shadow: inset 0 0 0 2px var(--action); }
.kpi-cell .of { font: 400 13px/20px var(--text); color: var(--text-2); }
.kpi-tags { display: flex; gap: 6px; }

/* Card (Requests card) */
.card { background: var(--surface); border: 1px solid var(--b-default); border-radius: 4px; padding: 24px; }
.card + .card { margin-top: 24px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }

/* Field */
.field { position: relative; }
.field i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--icon); pointer-events: none; }
.field input, .field select { height: 40px; border: 1px solid var(--b-input); border-radius: 4px; background: var(--surface); font: 400 16px/24px var(--text); outline: none; }
.field input { width: 210px; padding: 0 12px 0 38px; }
.field input::placeholder { color: var(--text-2); }
.field select { -webkit-appearance: none; appearance: none; padding: 0 36px 0 12px; font-size: 15px; cursor: pointer; }
.field.sel::after { content: "\ea5f"; font-family: tabler-icons; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
.field select.changed { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); }

.fb-critical { background: var(--action); border-color: var(--action); color: #fff; }
.fb-attention { background: var(--warn-bg); border-color: var(--warn-b); color: var(--warn-t); }

.fp-link { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font: 500 13px/20px var(--text); text-decoration: underline; }
.flag-d { padding: 12px 0; border-top: 1px solid var(--b-sep); }

.img-tags { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.f-body { padding: 0 4px; }

.box { border: 1px solid var(--b-default); border-radius: 4px; padding: 12px; }
.util-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
.util-bar { display: flex; gap: 2px; height: 4px; background: var(--b-sep); overflow: hidden; }
.util-bar span { display: block; height: 100%; }
.u-sample { background: var(--info-b); } .u-sup { background: var(--warn-b); } .u-live { background: var(--ok-bold); } .u-draft { background: var(--b-default); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }

.figs { display: grid; grid-template-columns: repeat(4, 1fr); }

.flags { display: flex; flex-direction: column; }

@media (max-width: 1100px) { .bento { grid-template-columns: 1fr 1fr; } .span2 { grid-column: span 2; } }

/* Table (Requests table) */

.sla-line { margin-top: 14px; }

.u-sample { background: var(--c-purple); } .u-sup { background: var(--c-yellow); } .u-live { background: var(--c-teal); } .u-draft { background: var(--c-grey); }
/* card utilisation bar: rounded segments */

.legend .k { width: 8px; height: 8px; }
/* KPI strip icons */
.kpi-top { align-items: flex-start; }
/* flag button + popover */

.fb-critical { background: var(--crit-bg); color: var(--crit-t); }

/* alert rows (popover, detail, bell) */

.arow .t { font: 500 15px/22px var(--text); } .arow .s { font: 400 13px/20px var(--text); color: var(--text-2); }
.arow .body { flex: 1; min-width: 0; }
.arow .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.arow .why { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(17,17,17,.12); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font: 400 13px/20px var(--text); }
.arow .why .eyebrow { display: block; font-size: 10px; line-height: 14px; color: var(--text-2); margin-bottom: 2px; }
/* stacked utilisation on fabric page */
.stack { height: 16px; gap: 3px; border-radius: 0; overflow: visible; }
.stack span { border-radius: 9999px; }
.stack-legend .k { border-radius: 9999px; }
/* stock gauge */
.gauge { height: 10px; border-radius: 9999px; background: var(--c-grey-s); }
.gauge .lvl { border-radius: 9999px; }
.gauge .mk { width: 2px; margin-left: -1px; border-radius: 2px; }
/* SLA bar */
.sla { border-radius: 8px; }
.sla-bar { height: 10px; gap: 3px; background: var(--c-grey-s); border-radius: 9999px; }
.sla-bar span, .sla-bar span:first-child { border-radius: 9999px; }
.sla-legend i { border-radius: 9999px; }
/* production track */
.track .fill { background: var(--c-teal); }
.stg.done .dot::after { background: var(--c-teal); }
.stg.now .dot { border-color: var(--c-teal); } .stg.now .n { color: var(--ok-t); }
.stg.slow .dot { border-color: var(--c-amber); } .stg.slow .n { color: var(--warn-t); }
.stg.stuck .dot { border-color: var(--crit); } .stg.stuck .dot::after { background: var(--crit); } .stg.stuck .n { color: var(--crit-t); }
.stg.rejected .dot::after { background: var(--crit); }
/* chart */
.chart .grid-l { stroke: #ececec; stroke-dasharray: 4 4; }
.tip { border-radius: 10px; border-color: var(--b-subtle); box-shadow: 0 10px 28px -12px rgba(17,17,17,.3); padding: 10px 12px; }
.tip .v { font: 600 18px/24px var(--display); }
.hov-dot { position: absolute; width: 12px; height: 12px; border-radius: 9999px; background: var(--c-teal); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--c-teal); transform: translate(-50%, -50%); display: none; pointer-events: none; }
/* bell rows */
.al-row .ic { margin-right: -4px; }
</style>
</head>
<body>

<nav class="topnav">
  <button class="logo" id="home">littlebox</button>
  <div class="nav-search"><i class="ti ti-search"></i><input id="search" type="text" placeholder="Search fabric portfolio…" autocomplete="off"></div>
  <div class="nav-right">
    <div style="position:relative">
      <button class="round-btn" id="bell" aria-label="Alerts" aria-expanded="false"><i class="ti ti-bell"></i><span class="bell-count" id="bell-count">0</span></button>
      <div class="alerts" id="alerts" role="dialog" aria-label="Alerts"></div>
    </div>
    <button class="round-btn" aria-label="Account"><i class="ti ti-user"></i></button>
  </div>
</nav>

<main class="page">
  <!-- PORTFOLIO -->
  <section class="view active" id="view-portfolio">
    <div class="page-header">
      <div><h1 class="headline-sm">Fabric Portfolio</h1><p class="muted">Check each fabric’s stock, sales and production stage, and what needs action.</p></div>
    </div>
    <div class="kpis" id="stats"></div>
    <div class="card">
      <div class="card-head">
        <h2 class="title-sm">Fabrics</h2>
        <div class="field"><i class="ti ti-search"></i><input id="search2" type="text" placeholder="Search fabrics…" autocomplete="off"></div>
      </div>
      <div class="toolbar">
        <div class="chips" id="f-status">
          <button class="chip on" data-v="all">All</button><button class="chip" data-v="Approved">Approved</button><button class="chip" data-v="Pending">Pending</button><button class="chip" data-v="Rejected">Rejected</button>
        </div>
        <span class="spacer"></span>
        <div class="field sel"><select id="f-perf" aria-label="Performance"><option value="all">All performance</option><option value="high">High · ROS ≥ 4</option><option value="low">Low · ROS &lt; 1</option><option value="none">No sales</option></select></div>
        <div class="field sel"><select id="f-stock" aria-label="Inventory"><option value="all">All inventory</option><option>Healthy</option><option>Low</option><option>Out of stock</option></select></div>
        <div class="field sel"><select id="f-sort" aria-label="Sort"><option value="tier">Sort: Needs action first</option><option value="ros">Sort: Rate of sale</option><option value="revenue">Sort: Revenue</option><option value="units">Sort: Units sold</option><option value="stock">Sort: Stock</option><option value="date">Sort: Approval date</option></select></div>
        <button class="btn btn-secondary btn-sm" id="reset" disabled>Reset</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="results"><span class="body-sm muted" id="count"></span><button class="page-btn">1</button></div>
    </div>
  </section>

  <!-- FABRIC DETAIL -->
  <section class="view" id="view-fabric">
    <div class="crumb body-sm"><button id="back">Fabric Portfolio</button><i class="ti ti-chevron-right"></i><span id="crumb-name"></span></div>
    <div class="page-header">
      <div class="d-id"><div class="thumb60" id="d-thumb"></div><div><h1 class="headline-sm" id="d-title"></h1><p class="muted" id="d-sub"></p></div></div>
      <div class="f-badges" id="d-badges" style="margin-top:6px"></div>
    </div>
    <div class="bento" id="bento"></div>
    <div class="card">
      <div class="card-head"><h2 class="title-sm">Products <span class="muted" id="p-count" style="font-weight:500"></span></h2><span class="body-sm muted">Open a row to see where it is in production.</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Image</th>
          <th class="sortable" data-k="name">Product <i class="ti ti-arrows-sort"></i></th>
          <th>Category</th><th>Status</th>
          <th class="sortable" data-k="revenue">Revenue <i class="ti ti-arrows-sort"></i></th>
          <th class="sortable" data-k="units">Units <i class="ti ti-arrows-sort"></i></th>
          <th class="sortable" data-k="ros">ROS <i class="ti ti-arrows-sort"></i></th>
          <th>Signal</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
      <div class="results"><span class="body-sm muted" id="p-results"></span><button class="page-btn">1</button></div>
    </div>
  </section>
</main>

function flagsFor(f) {

    const d = days(f.approvalDate, TODAY);
    out.push(d > APPROVAL_SLA ? { tier: "attention", text: "Pending past approval SLA", tv: `${d} days in review` } : { tier: "info", text: "Awaiting approval", tv: `${d} days in review` });
    return out;
  }
  if (f.status === "Rejected") {
    const weak = f.perf.ros < 1 || prods(f.code).some(p => p.status === "Live" && p.units === 0);
    if (weak && live > 0) out.push({ tier: "attention", text: "Rejected · live products with weak sales", tv: `ROS ${f.perf.ros.toFixed(1)} · decide whether to delist` });
    return out;
  }
  // STOCK
  if (st === "Out of stock" && waiting > 0) out.push({ tier: "critical", text: "Out of stock with products waiting", tv: `0m left · ${waiting} products waiting` });
  else if (st === "Low" && live > 0 && f.perf.ros > 0) out.push({ tier: "critical", text: "Low stock on a selling print", tv: `${f.stock}m left · ${live} live, ROS ${f.perf.ros.toFixed(1)}` });
  else if (st === "Low") out.push({ tier: "attention", text: "Low stock", tv: `${f.stock}m left · nothing live` });
  else if (f.stock > IDLE_STOCK && live === 0) out.push({ tier: "attention", text: "Idle stock", tv: `${f.stock}m with nothing live` });
  // PIPELINE
  if (f.breach || f.overdue > 7) out.push({ tier: "critical", text: `${f.stuckAt || "Journey"} breached`, tv: `${f.overdue} days past SLA` });
  else if (f.overdue > 0) out.push({ tier: "attention", text: `Delayed at ${f.stuckAt}`, tv: `${f.overdue} days past SLA` });
  // PERFORMANCE
  if (f.perf.revenue > 0 && f.perf.ros < 1) out.push({ tier: "attention", text: "Low rate of sale", tv: `ROS ${f.perf.ros.toFixed(1)}` });
  else if (prods(f.code).some(p => p.status === "Live" && p.units === 0)) out.push({ tier: "attention", text: "Live product with no sales", tv: "14+ days live" });
  if (f.perf.ros >= 4 && st === "Healthy") out.push({ tier: "opportunity", text: "High performing", tv: `ROS ${f.perf.ros.toFixed(1)} · ${f.stock}m in stock` });
  return out;
}

  [/^Out of stock/, "No stock left while products are in sampling, superimpose or draft.", "Raise a stock order with procurement."],
  [/^Low stock on a selling/, `Below ${LOW_STOCK}m while live products are selling.`, "Re-order before it runs out."],
  [/^Low stock/, `Below ${LOW_STOCK}m, but nothing is live yet.`, "Check stock before planning new products."],
  [/^Idle stock/, `Above ${IDLE_STOCK}m with no live products.`, "Get products live, or pause buying this fabric."],
  [/breached$/, `More than 7 days past the ${SLA_DAYS}-day SLA.`, "Chase the team at the stuck stage."],
  [/^Delayed/, `Past the ${SLA_DAYS}-day SLA by up to 7 days.`, "Follow up with the team at that stage."],
  [/^Low rate of sale/, "Rate of sale is under 1.", "Review pricing or delist."],
  [/^Live product with no sales/, "A live product has not sold yet.", "Check the listing, images and price."],
  [/^High performing/, "Rate of sale is 4 or more, with healthy stock.", "Plan more products on this print."]
];
const helpFor = fl => (FLAG_HELP.find(h => h[0].test(fl.text)) || [, "", ""]);
const flagIcon = fl => /stock/i.test(fl.text) ? (/Out of/.test(fl.text) ? "ti-package-off" : /Idle/.test(fl.text) ? "ti-packages" : "ti-package") : /breached|Delayed/.test(fl.text) ? "ti-clock-exclamation" : /approval/i.test(fl.text) ? "ti-hourglass" : /High performing/.test(fl.text) ? "ti-trending-up" : /Rejected/.test(fl.text) ? "ti-ban" : "ti-chart-line";
const icon = (cls, ti, sm) => `<span class="ic ${sm ? "sm " : ""}${cls}"><i class="ti ${ti}"></i></span>`;
function flagsCard(f) {
  const fl = sortedFlags(f);
  const row = x => { const h = helpFor(x); return `<div class="arow ${x.tier}">${icon("ic-" + x.tier, flagIcon(x))}<div class="body">
    <div class="head"><span class="t">${x.text}</span>${tierBadge(x.tier)}</div><div class="s">${x.tv}</div>
    ${h[1] ? `<div class="why"><div><span class="eyebrow">Why</span>${h[1]}</div><div><span class="eyebrow">Next step</span>${h[2]}</div></div>` : ""}</div></div>`; };
  return `<div class="card"><div class="card-head"><h2 class="title-sm">Flags</h2><span class="body-sm muted">${fl.length} active</span></div>
    ${fl.length ? fl.map(row).join("") : `<div class="arow opportunity">${icon("ic-green", "ti-circle-check")}<div class="body"><div class="t">Nothing needs action</div></div></div>`}</div>`;
}
function stockCard(f) {
  const pending = f.status === "Pending", st = pending ? null : stockStatus(f), scale = Math.max(300, Math.ceil(f.stock * 1.2 / 50) * 50);
  const col = st === "Out of stock" || (st === "Low" && f.util.live) ? "var(--action)" : st === "Low" || (f.stock > IDLE_STOCK && !f.util.live) ? "var(--warn-b)" : "var(--ok-bold)";
  const hxc = st === "Out of stock" || (st === "Low" && f.util.live) ? "hx-red" : st === "Low" || (f.stock > IDLE_STOCK && !f.util.live) ? "hx-amber" : "hx-green";
  const note = pending ? "Not procured until the fabric is approved." : f.stock > IDLE_STOCK && !f.util.live ? "Above 200m with nothing live: stock is sitting idle." : st === "Healthy" ? "Between the low and idle levels." : st === "Low" ? `Below ${LOW_STOCK}m${f.util.live ? " while products are selling." : "."}` : "Nothing left to cut from.";
  return `<div class="card"><div class="card-head"><h2 class="title-sm">Stock</h2>${st ? badge(st === "Healthy" ? "b-success" : st === "Low" ? "b-warning" : "b-critical", st) : badge("b-info", "Not procured")}</div>
    <div class="headline-md">${f.stock}m</div>
    <div class="gauge"><div class="lvl hx ${hxc}" style="width:${Math.max(f.stock ? 3 : 0, Math.min(100, f.stock / scale * 100))}%"></div>
      <div class="mk" style="left:${LOW_STOCK / scale * 100}%"><span>Low ${LOW_STOCK}m</span></div><div class="mk" style="left:${IDLE_STOCK / scale * 100}%"><span>Idle ${IDLE_STOCK}m</span></div></div>
    <div class="gauge-scale body-sm muted"><span>0m</span><span>${scale}m</span></div>
    <div class="card-foot body-sm muted">${note}</div></div>`;
}
function utilCard(f) {
  const u = f.util, tot = u.sampling + u.superimpose + u.live + u.draft, pct = n => tot ? Math.round(n / tot * 100) : 0;
  const parts = [["Sample", u.sampling, "u-sample"], ["Superimposed", u.superimpose, "u-sup"], ["Live", u.live, "u-live"], ["Draft", u.draft, "u-draft"]];
  return `<div class="card span2"><div class="card-head"><h2 class="title-sm">Utilisation pipeline</h2><span class="body-sm muted">${tot} products on this fabric</span></div>
    ${tot ? `<div class="stack">${parts.filter(p => p[1]).map(p => `<span class="hx hx-${p[2].slice(2)}" style="flex:${p[1]}" title="${p[0]}: ${p[1]}"></span>`).join("")}</div>
    <div class="stack-legend">${parts.map(p => `<div><div class="lg"><i class="k ${p[2]}"></i><span class="body-sm muted">${p[0]}</span></div><div class="headline-sm">${p[1]}</div><div class="body-sm muted">${pct(p[1])}% of products</div></div>`).join("")}</div>`
    : `<div class="body-sm muted">No products yet. They appear once the fabric is approved and sampled.</div>`}</div>`;
}
function renderBento() {
  const f = fab(state.selected);
  $("#bento").innerHTML = salesCard(f) + flagsCard(f) + stockCard(f) + utilCard(f);
  const data = weeklySales(f); if (data.length) wireChart(data, state.metric || "units");
  $$("#metric .chip").forEach(c => c.onclick = () => { state.metric = c.dataset.m; renderBento(); });
}
function openFabric(code) {
  state.selected = code; closeAlerts();
  const f = fab(code), t = tierOf(f);
  $("#crumb-name").textContent = f.name;
  $("#d-title").textContent = f.name;
  $("#d-thumb").style.background = SWATCH[f.code];
  $("#d-sub").textContent = `${f.code} · By ${f.designer} · ${f.status === "Pending" ? "Submitted" : f.status} ${f.approvalDate}`;
  const tat = f.status === "Rejected" ? ["b-neutral", "Liquidating"] : f.status === "Pending" ? ["b-info", "Awaiting approval"] : f.overdue ? [f.breach || f.overdue > 7 ? "b-critical" : "b-warning", `TAT ${f.overdue} days overdue`] : ["b-success", "TAT on track"];
  $("#d-badges").innerHTML = badge(STATUS_BADGE[f.status], f.status) + badge(tat[0], tat[1]) + (t !== "none" ? tierBadge(t) : "");
  renderBento(); renderProducts();
  $("#view-portfolio").classList.remove("active"); $("#view-fabric").classList.add("active");
  window.scrollTo({ top: 0 });
}
function showPortfolio() { $("#view-fabric").classList.remove("active"); $("#view-portfolio").classList.add("active"); window.scrollTo({ top: 0 }); }
function sigBadge(s) { return badge(s === "Top performer" ? "b-success" : s === "Lowest performer" ? "b-warning" : s === "No sales" ? "b-critical" : s === "Not yet live" ? "b-info" : "b-neutral", s); }
function renderProducts() {
  const f = fab(state.selected), k = state.pSort, d = state.pDir, l = prods(f.code).slice();
  if (k !== "name") l.sort((a, b) => d < 0 ? b[k] - a[k] : a[k] - b[k]); else l.sort((a, b) => d < 0 ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  $("#p-count").textContent = `· ${l.length}`;
  $("#p-results").textContent = `${l.length} result${l.length !== 1 ? "s" : ""}`;
  $$("th.sortable").forEach(th => { th.classList.toggle("on", th.dataset.k === k); th.querySelector("i").className = "ti " + (th.dataset.k === k ? (d < 0 ? "ti-sort-descending" : "ti-sort-ascending") : "ti-arrows-sort"); });
  if (!l.length) { $("#tbody").innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px" class="muted">No products on this fabric yet. They appear once it is approved and sampled.</td></tr>`; return; }
  $("#tbody").innerHTML = l.map(p => `<tr class="row" data-sku="${p.sku}">
    <td><div class="thumb" style="background:${pimg(p)}"></div></td>
    <td>${p.name}<div class="sub">${p.sku}</div></td>
    <td>${p.cat}<div class="sub">${p.sil}</div></td>
    <td>${badge(STATUS_BADGE[p.status], p.status)}</td>
    <td>${p.revenue ? inr(p.revenue) : "—"}</td><td>${p.units || "—"}</td><td>${p.ros ? p.ros.toFixed(1) : "—"}</td>
    <td>${sigBadge(p.signal)}</td>
    <td style="text-align:right"><i class="ti ti-circle-arrow-down disc"></i></td></tr>`).join("");
  $$("#tbody .row").forEach(r => r.onclick = () => toggleDrawer(r));
}
function slaHTML(J, elapsed, cur) {
  const scale = Math.max(SLA_DAYS, elapsed), over = elapsed - SLA_DAYS;
  const col = { done: "var(--c-teal)", now: "var(--c-blue)", slow: "var(--c-amber)", stuck: "var(--c-red)" }, hxs = { done: "hx-green", now: "hx-blue", slow: "hx-amber", stuck: "hx-red" };
  const segs = J.filter(x => parseInt(x[2]) > 0);
  const note = over > 0 ? `${cur ? cur[0] : "The journey"} pushed it ${over} day${over > 1 ? "s" : ""} past the SLA.` : cur ? `${SLA_DAYS - elapsed} days left before the SLA.` : "Reached first sale within the SLA.";
  return `<div class="sla">
    <div class="sla-top"><div><span class="eyebrow muted">Time against SLA</span><div><span class="headline-sm">${elapsed}</span><span class="body-sm muted"> of ${SLA_DAYS} days</span></div></div>
      <div class="body-sm ${over > 0 ? "" : "muted"}" style="text-align:right">${over > 0 ? `<b style="font-weight:500">${over} days over</b>` : cur ? `${SLA_DAYS - elapsed} days left` : "Completed"}</div></div>
    <div class="sla-bar">${segs.map(x => `<span class="hx ${hxs[x[3]] || "hx-green"}" style="width:${parseInt(x[2]) / scale * 100}%" title="${x[0]}: ${x[2]}"></span>`).join("")}
      <i class="sla-mk ${SLA_DAYS / scale > .9 ? "end" : ""}" style="left:${SLA_DAYS / scale * 100}%"><em>SLA · day ${SLA_DAYS}</em></i></div>
    <div class="sla-legend">${segs.map(x => `<span><i style="background:${col[x[3]] || col.done}"></i>${x[0]} <b>${parseInt(x[2])}d</b></span>`).join("")}</div>
    ${over > 0 || !cur ? `<div class="body-sm muted" style="margin-top:6px">${note}</div>` : ""}</div>`;
}
function journeyFor(p) { return p.journey || JOURNEYS[p.fab]; }
function toggleDrawer(row) {
  const wasOpen = row.classList.contains("open");
  $$("#tbody .open").forEach(r => { r.classList.remove("open"); r.querySelector(".disc").className = "ti ti-circle-arrow-down disc"; r.nextElementSibling?.classList.contains("drawer") && r.nextElementSibling.remove(); });
  if (wasOpen) return;
  row.classList.add("open"); row.querySelector(".disc").className = "ti ti-circle-arrow-right disc";
  const p = PRODUCTS.find(x => x.sku === row.dataset.sku), f = fab(p.fab), J = journeyFor(p);
  const elapsed = J.reduce((s, x) => s + (parseInt(x[2]) || 0), 0);
  const stuck = J.find(x => x[3] === "stuck"), slow = J.find(x => x[3] === "slow"), now = J.find(x => x[3] === "now"), rejected = J.find(x => x[3] === "rejected");
  let stage, colour, line, b;
  if (rejected) { stage = "Live for liquidation"; colour = "var(--text-1)"; b = badge("b-neutral", "No SLA"); line = "Rejected fabric. Existing stock was cleared to sell; decide whether to delist low performers."; }
  else if (f.status === "Pending") { stage = "Fabric Approval"; colour = "var(--info-t)"; b = badge("b-info", "Not started"); line = `The ${SLA_DAYS}-day clock starts at approval.`; }
  else if (stuck) { stage = stuck[0]; colour = "var(--text-1)"; b = badge("b-critical", `${elapsed - SLA_DAYS} days overdue`); line = `<b style="font-weight:500">${elapsed} of ${SLA_DAYS} days · Stuck at ${stuck[0]}.</b> ${stuck[1]}, chase the catalogue team.`; }
  else if (slow) { stage = slow[0]; colour = "var(--warn-t)"; b = badge("b-warning", `${elapsed - SLA_DAYS} days overdue`); line = `<b style="font-weight:500">${elapsed} of ${SLA_DAYS} days · Delayed at ${slow[0]}.</b> ${slow[1]}.`; }
  else if (now) { stage = now[0]; colour = "var(--ok-t)"; b = badge("b-success", "On track"); line = `<b style="font-weight:500">${elapsed} of ${SLA_DAYS} days.</b> ${SLA_DAYS - elapsed} days left within the SLA.`; }
  else { stage = "First Sale"; colour = "var(--ok-t)"; b = badge("b-success", "Within SLA"); line = `<b style="font-weight:500">${elapsed} of ${SLA_DAYS} days.</b> Reached first sale, no bottleneck.`; }
  const doneN = J.filter(x => x[3] === "done").length, fill = Math.max(0, doneN - 1) / 4 * 80;
  row.insertAdjacentHTML("afterend", `<tr class="drawer"><td colspan="9"><div class="drawer-inner">
    <div class="drawer-head"><i class="ti ti-calendar"></i><div><div class="title-sm">${p.name}</div><div class="body-sm muted">${p.sku} · ${p.cat} · ${p.sil}</div></div>
      <button class="close" onclick="this.closest('tr').previousElementSibling.click()"><i class="ti ti-x"></i>Close</button></div>
    <div class="drawer-body"><div class="img" style="background:${pimg(p)}"></div>
      <div>
        <div class="section">${secHead("Production status")}
          <div class="cur"><i class="ti ti-flag-3" style="color:${colour}"></i><span class="body-sm muted">Current stage:</span><b style="color:${colour}">${stage}</b>${b}</div>
          <div class="track"><div class="fill" style="width:${fill}%"></div>${J.map(x => `<div class="stg ${x[3]}"><div class="dot"></div><div class="n">${x[0]}</div><div class="d">${x[3] === "todo" ? "—" : `${x[1]} · ${x[2]}`}</div></div>`).join("")}</div>
          ${rejected || f.status === "Pending" ? `<div class="body-sm sla-line">${line}</div>` : slaHTML(J, elapsed, stuck || slow || now)}</div>
        <div class="section">${secHead("Details")}<div class="meta">${cell("SKU", p.sku)}${cell("Category", p.cat)}${cell("Silhouette", p.sil)}${cell("Status", badge(STATUS_BADGE[p.status], p.status))}${cell("Revenue", p.revenue ? inr(p.revenue) : "—")}${cell("Units sold", p.units || "—")}${cell("Rate of sale", p.ros ? p.ros.toFixed(1) : "—")}${cell("Signal", sigBadge(p.signal))}${cell("Fabric", f.code)}</div></div>
      </div></div>
  </div></td></tr>`);
}

/* ================= ALERTS ================= */
function renderAlerts() {
  const rows = FABRICS.map(f => ({ f, fl: sortedFlags(f), t: tierOf(f) }));
  const act = rows.filter(r => r.t === "critical" || r.t === "attention");
  $("#bell-count").textContent = act.length; $("#bell-count").style.display = act.length ? "" : "none";
  const row = r => { const top = r.fl[0], extra = r.fl.filter(x => x.tier === "critical" || x.tier === "attention").length - 1;
    return `<button class="al-row" data-go="${r.f.code}"><span class="thumb" style="background:${SWATCH[r.f.code]}"></span><span class="txt"><div class="label-md">${r.f.name}</div><div class="body-sm muted">${top.text} · ${top.tv}</div>${extra > 0 ? `<div class="more">+${extra} more</div>` : ""}</span>${tierBadge(r.t)}</button>`; };
  const group = (t, label) => { const g = act.filter(r => r.t === t); return g.length ? `<div class="eyebrow al-group">${label} · ${g.length}</div>${g.map(row).join("")}` : ""; };
  const quiet = rows.filter(r => r.t === "opportunity" || r.t === "info");
  $("#alerts").innerHTML = `<div class="al-head"><div class="title-sm">Needs action</div><div class="body-sm muted">${act.length} fabric${act.length !== 1 ? "s" : ""} · one row each, worst flag first</div></div>
    <div class="al-body">${act.length ? group("critical", "Critical · act today") + group("attention", "Attention · act this week") : `<div class="body-sm muted" style="padding:24px 20px">Nothing needs action right now.</div>`}
    ${quiet.length ? `<button class="btn btn-secondary btn-sm al-toggle" id="al-toggle">Worth a look · ${quiet.length} <i class="ti ti-chevron-down"></i></button><div class="al-quiet" id="al-quiet">${group2(quiet, row)}</div>` : ""}</div>`;
  $$("#alerts [data-go]").forEach(b => b.onclick = () => openFabric(b.dataset.go));
  const tg = $("#al-toggle"); if (tg) tg.onclick = e => { e.stopPropagation(); $("#al-quiet").classList.toggle("open"); };
}
const group2 = (rows, row) => rows.map(row).join("");
function closeAlerts() { $("#alerts").classList.remove("open"); $("#bell").classList.remove("open"); $("#bell").setAttribute("aria-expanded", "false"); }

/* ================= WIRING ================= */
const onSearch = e => { state.q = e.target.value.toLowerCase().trim(); $("#search").value = $("#search2").value = e.target.value; showPortfolio(); renderGrid(); };
$("#search").oninput = onSearch; $("#search2").oninput = onSearch;
$$("#f-status .chip").forEach(c => c.onclick = () => { state.status = c.dataset.v; renderGrid(); });
["perf", "stock", "sort"].forEach(k => $("#f-" + k).onchange = e => { state[k] = e.target.value; renderGrid(); });
$("#reset").onclick = resetAll;
$("#back").onclick = showPortfolio; $("#home").onclick = showPortfolio;
$$("th.sortable").forEach(th => th.onclick = () => { if (state.pSort === th.dataset.k) state.pDir *= -1; else { state.pSort = th.dataset.k; state.pDir = -1; } renderProducts(); });
$("#bell").onclick = e => { e.stopPropagation(); const o = $("#alerts").classList.toggle("open"); $("#bell").classList.toggle("open", o); $("#bell").setAttribute("aria-expanded", o); };
$("#alerts").onclick = e => e.stopPropagation();
document.addEventListener("click", () => { closeAlerts(); closePops(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeAlerts(); closePops(); } });
function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("fabric")) { openFabric(h.get("fabric")); if (h.get("sku")) { const r = document.querySelector(`tr[data-sku="${h.get("sku")}"]`); r && toggleDrawer(r); } }
  if (h.has("alerts")) setTimeout(() => $("#bell").click(), 50);
  if (h.get("flags")) setTimeout(() => document.querySelector(`[data-flags="${h.get("flags")}"]`).click(), 50);
}
renderGrid(); renderAlerts(); fromHash();
</script>
